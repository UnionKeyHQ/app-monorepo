name: release-web

on:
  workflow_run:
    workflows:
      - daily-build
    types:
      - completed
  workflow_dispatch:

jobs:
  test-web:
    runs-on: ubuntu-latest
    env:
      TEST_ENDPOINT: app.unionkeytest.com
    if: ${{ !github.event.workflow_run || (github.event.workflow_run && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Run Shared Env Setup
        uses: ./.github/actions/shared-env
        with:
          env_file_name: '.env'
          sentry_project: 'web'
          covalent_key: ${{ secrets.COVALENT_KEY }}
          sentry_token: ${{ secrets.SENTRY_TOKEN }}

      - name: Setup Environment
        uses: actions/setup-node@v3
        with:
          registry-url: 'https://npm.pkg.github.com'
          always-auth: true
          scope: '@unionkeyhq'
          node-version: '20.x'

      - name: Setup ENV
        run: |

          eval "$(node -e 'const v=require("./apps/web/package.json").version; console.log("pkg_version="+v)')"
          echo '$pkg_version='$pkg_version
          echo "PKG_VERSION=$pkg_version" >> $GITHUB_ENV

          artifacts_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "ARTIFACTS_URL=$artifacts_url" >> $GITHUB_ENV

          echo "HOST_PATH=${{ github.event.repository.name }}/${{ github.sha }}-${{ env.BUILD_NUMBER }}/" >> $GITHUB_ENV
          echo "PUBLIC_URL=https://asset.unionkey-asset.com/${{ github.event.repository.name }}/${{ github.sha }}-${{ env.BUILD_NUMBER }}/" >> $GITHUB_ENV

      - name: Install Dependency
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          yarn

      - name: Build Target
        env:
          PUBLIC_URL: ${{ env.PUBLIC_URL }}
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          yarn app:web:build

      - name: Deploy to CDN
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
        run: aws s3 sync ./apps/web/web-build/ "s3://${AWS_BUCKET}/${HOST_PATH}" --delete

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-monorepo-${{ github.sha }}
          path: |
            ./apps/web/web-build/

      - name: Deploy Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/web/web-build
          cname: ${{ env.TEST_ENDPOINT }}
          force_orphan: true
